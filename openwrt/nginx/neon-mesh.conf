# neon-mesh releases, apk feed and OTA manifests under /neon-mesh/ of an existing HTTPS site (docs/OTA.md).
# Installed to /etc/nginx/snippets/neon-mesh.conf and included from that site's server block by
# install.sh. Files come from /srv/neon-releases/neon-mesh/, which release.sh and ota-promote.sh fill.
# Everything under it is public: publish only images that carry no site values or credentials.

location = /neon-mesh {
    return 301 /neon-mesh/;
}

# ^~: a prefix match that no regex location may take over; everything else on the host still goes to the app
location ^~ /neon-mesh/ {
    root /srv/neon-releases;
    autoindex off;
    limit_except GET { deny all; }          # GET includes HEAD
    types { application/json json; text/plain txt sig seed full; application/octet-stream bin itb apk adb; }
    default_type application/octet-stream;
    access_log /var/log/nginx/neon-mesh.access.log;

    # A tag's files do not change once published. CDNs (Cloudflare) cache .bin/.apk by extension; an hour
    # bounds how long a re-published tag could serve stale bytes -- and those would fail the sha256
    # check on the unit, not install.
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options nosniff always;

    # The manifests move whenever a release is promoted, and `latest` is a symlink that moves too.
    location ^~ /neon-mesh/ota/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /neon-mesh/latest/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
